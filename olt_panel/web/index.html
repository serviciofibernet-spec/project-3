<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel OLT C300 V2</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 16px 24px; background: #111827; border-bottom: 1px solid #1f2937; }
    h1 { margin: 0; font-size: 18px; }
    main { padding: 20px; display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 16px; }
    label { display: block; margin-top: 8px; font-size: 12px; color: #9ca3af; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; border-radius: 8px; border: 1px solid #374151; background: #0b1220; color: #e2e8f0; }
    textarea { height: 120px; }
    button { margin-top: 10px; background: #2563eb; color: white; border: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
    button.secondary { background: #374151; }
    pre { white-space: pre-wrap; word-break: break-word; background: #0b1220; padding: 12px; border-radius: 8px; border: 1px solid #374151; max-height: 60vh; overflow: auto; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Panel OLT C300 V2</h1>
  </header>
  <main>
    <section class="card">
      <label>Dispositivo</label>
      <select id="deviceSelect"></select>
      <div class="row">
        <button onclick="getVersion()">Ver versión</button>
        <button class="secondary" onclick="listOnus()">Listar ONUs</button>
      </div>
      <label>Puerto PON (e.g. 1/1/1)</label>
      <input id="ponPort" placeholder="1/1/1" />
      <hr style="border-color:#1f2937; margin: 14px 0;" />
      <h3 style="margin:6px 0 0 0">Agregar ONU</h3>
      <label>ONU ID</label>
      <input id="onuId" type="number" />
      <label>Serial</label>
      <input id="onuSn" placeholder="XXXXYYYYZZZZ" />
      <label>Descripción (opcional)</label>
      <input id="onuDesc" />
      <label>Perfil de línea (opcional)</label>
      <input id="lineProfile" />
      <label>Perfil de servicio (opcional)</label>
      <input id="srvProfile" />
      <button onclick="addOnu()">Agregar</button>
      <button class="secondary" onclick="deleteOnu()">Eliminar ONU</button>
      <hr style="border-color:#1f2937; margin: 14px 0;" />
      <h3 style="margin:6px 0 0 0">Comandos personalizados</h3>
      <label>Comandos (uno por línea)</label>
      <textarea id="commands" placeholder="enable\nshow version"></textarea>
      <button onclick="runCommands()">Ejecutar</button>
    </section>
    <section class="card">
      <h3 style="margin:0 0 10px 0">Salida</h3>
      <pre id="output">Inicializando...</pre>
    </section>
  </main>
<script>
  const devSel = document.getElementById('deviceSelect');
  const out = document.getElementById('output');

  async function refreshDevices() {
    try {
      const res = await fetch('/api/olt/devices');
      const items = await res.json();
      devSel.innerHTML = '';
      items.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.name;
        opt.textContent = `${d.name} (${d.host})`;
        devSel.appendChild(opt);
      });
      out.textContent = 'Dispositivos cargados.';
    } catch (e) {
      out.textContent = 'Error cargando dispositivos: ' + e;
    }
  }

  async function getVersion() {
    const dev = devSel.value;
    try {
      const res = await fetch(`/api/olt/${encodeURIComponent(dev)}/version`);
      const json = await res.json();
      out.textContent = json.output || JSON.stringify(json, null, 2);
    } catch (e) {
      out.textContent = 'Error: ' + e;
    }
  }

  async function listOnus() {
    const dev = devSel.value;
    const pon = document.getElementById('ponPort').value;
    try {
      const url = pon ? `/api/olt/${encodeURIComponent(dev)}/onus?pon_port=${encodeURIComponent(pon)}` : `/api/olt/${encodeURIComponent(dev)}/onus`;
      const res = await fetch(url);
      const json = await res.json();
      out.textContent = json.output || JSON.stringify(json, null, 2);
    } catch (e) {
      out.textContent = 'Error: ' + e;
    }
  }

  async function addOnu() {
    const dev = devSel.value;
    const payload = {
      pon_port: document.getElementById('ponPort').value,
      onu_id: Number(document.getElementById('onuId').value),
      serial_number: document.getElementById('onuSn').value,
      description: document.getElementById('onuDesc').value || null,
      line_profile: document.getElementById('lineProfile').value || null,
      service_profile: document.getElementById('srvProfile').value || null,
    };
    try {
      const res = await fetch(`/api/olt/${encodeURIComponent(dev)}/onu`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const json = await res.json();
      out.textContent = json.output || JSON.stringify(json, null, 2);
    } catch (e) {
      out.textContent = 'Error: ' + e;
    }
  }

  async function deleteOnu() {
    const dev = devSel.value;
    const payload = {
      pon_port: document.getElementById('ponPort').value,
      onu_id: Number(document.getElementById('onuId').value),
    };
    try {
      const res = await fetch(`/api/olt/${encodeURIComponent(dev)}/onu`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const json = await res.json();
      out.textContent = json.output || JSON.stringify(json, null, 2);
    } catch (e) {
      out.textContent = 'Error: ' + e;
    }
  }

  async function runCommands() {
    const dev = devSel.value;
    const commands = document.getElementById('commands').value.split(/\r?\n/).filter(Boolean);
    if (!commands.length) { out.textContent = 'Agregue al menos un comando.'; return; }
    try {
      const res = await fetch(`/api/olt/${encodeURIComponent(dev)}/command`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ commands }) });
      const json = await res.json();
      out.textContent = json.output || JSON.stringify(json, null, 2);
    } catch (e) {
      out.textContent = 'Error: ' + e;
    }
  }

  refreshDevices();
</script>
</body>
</html>
