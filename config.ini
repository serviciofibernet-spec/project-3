# TR-069 Server Configuration
[server]
host = 0.0.0.0
port = 8080
ssl_port = 8443

[logging]
level = INFO
file = tr069_server.log

[database]
# SQLite database file for persistent storage
file = tr069_devices.db

[security]
# Enable HTTPS (requires certificates)
enable_ssl = false
cert_file = server.crt
key_file = server.key

[device_management]
# Auto-cleanup devices that haven't reported in X hours
cleanup_hours = 24
max_devices = 1000